# Same-origin reverse proxy for the Katalis web + API.
# The browser only ever talks to this server: `/api/*` and `/v1/*` are proxied
# to the Bun/Hono container, everything else is the static SPA. Sessions are
# httpOnly cookies, so the two MUST share a single origin.

upstream katalis_api {
    server api:3000;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SSE streams can idle between tokens; the proxy must not cut them short.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    client_max_body_size 1m;

    location /api/ {
        proxy_pass http://katalis_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v1/ {
        proxy_pass http://katalis_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed assets never change under the same name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routing: unknown paths render the SPA, not a 404 page.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
